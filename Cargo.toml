[package]
name = "hurentohn"
version = "0.1.0"
edition = "2024"
description = "Plug-in manager for Jonas Grunau's audio plug-ins: GitHub releases, silent pkg installs, builds of main"
publish = false

[dependencies]
base64 = "0.22"
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
plist = "1"
raw-window-handle = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
